<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6b85"/>
    </marker>
  </defs>
  <rect width="760" height="980" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c2b4a">The decoder-only transformer (GPT)</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#5b6b85">read bottom-up &#8226; every arrow carries the residual stream, shape (T, d) &#8226; part numbers refer to the guide</text>

  <!-- ============ bottom: tokens ============ -->
  <g font-size="13">
    <rect x="255" y="895" width="250" height="40" rx="6" fill="#eef3fb" stroke="#1a6fb0" stroke-width="2"/>
    <text x="380" y="920" text-anchor="middle" fill="#1c2b4a">token IDs&#160;&#160;[464, 3797, 3332, &#8230;]</text>
  </g>

  <!-- embeddings -->
  <g font-size="13">
    <rect x="180" y="820" width="190" height="46" rx="6" fill="#fdf1e4" stroke="#e29b3d" stroke-width="2"/>
    <text x="275" y="839" text-anchor="middle" fill="#1c2b4a">token embedding E</text>
    <text x="275" y="856" text-anchor="middle" font-size="11.5" fill="#5b6b85">(V, d) lookup &#8226; Part 3</text>
    <rect x="390" y="820" width="190" height="46" rx="6" fill="#fdf1e4" stroke="#e29b3d" stroke-width="2"/>
    <text x="485" y="839" text-anchor="middle" fill="#1c2b4a">position embedding P</text>
    <text x="485" y="856" text-anchor="middle" font-size="11.5" fill="#5b6b85">(T_max, d) &#8226; Part 3, &#167;3.5</text>
    <circle cx="380" cy="778" r="15" fill="#ffffff" stroke="#5b6b85" stroke-width="2"/>
    <text x="380" y="784" text-anchor="middle" font-size="16" fill="#1c2b4a">+</text>
  </g>
  <line x1="330" y1="895" x2="290" y2="868" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="895" x2="470" y2="868" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="275" y1="820" x2="368" y2="786" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="485" y1="820" x2="392" y2="786" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="763" x2="380" y2="726" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ the repeated block ============ -->
  <rect x="150" y="266" width="460" height="460" rx="12" fill="#f7f9fc" stroke="#9db2d0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="596" y="294" text-anchor="end" font-size="14" font-weight="bold" fill="#1a6fb0">&#215; N blocks</text>
  <text x="596" y="312" text-anchor="end" font-size="11.5" fill="#5b6b85">(GPT-2 small: N = 12)</text>

  <!-- attention half -->
  <g font-size="13">
    <rect x="230" y="622" width="140" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
    <text x="300" y="641" text-anchor="middle" fill="#1c2b4a">LayerNorm</text>
    <text x="300" y="656" text-anchor="middle" font-size="11" fill="#5b6b85">pre-LN &#8226; &#167;5.3</text>
    <rect x="200" y="524" width="200" height="56" rx="6" fill="#e8f0f9" stroke="#1a6fb0" stroke-width="2.5"/>
    <text x="300" y="546" text-anchor="middle" fill="#1c2b4a">masked multi-head</text>
    <text x="300" y="562" text-anchor="middle" fill="#1c2b4a">self-attention</text>
    <text x="300" y="575" text-anchor="middle" font-size="10.5" fill="#5b6b85">Part 4 &#8226; tokens communicate</text>
    <circle cx="300" cy="482" r="14" fill="#ffffff" stroke="#5b6b85" stroke-width="2"/>
    <text x="300" y="488" text-anchor="middle" font-size="15" fill="#1c2b4a">+</text>
  </g>
  <!-- residual skip for attention -->
  <path d="M 300 692 L 490 692 L 490 482 L 316 482" fill="none" stroke="#d1495b" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="502" y="590" font-size="11.5" fill="#d1495b" transform="rotate(-90 502 590)" text-anchor="middle">residual &#8226; &#167;5.2</text>
  <line x1="300" y1="726" x2="300" y2="664" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="622" x2="300" y2="582" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="524" x2="300" y2="498" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="300" cy="692" r="4" fill="#d1495b"/>

  <!-- mlp half -->
  <g font-size="13">
    <rect x="230" y="404" width="140" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
    <text x="300" y="423" text-anchor="middle" fill="#1c2b4a">LayerNorm</text>
    <text x="300" y="438" text-anchor="middle" font-size="11" fill="#5b6b85">&#167;5.3</text>
    <rect x="200" y="306" width="200" height="56" rx="6" fill="#fdf1e4" stroke="#e29b3d" stroke-width="2.5" transform="translate(0,32)"/>
    <text x="300" y="360" text-anchor="middle" fill="#1c2b4a">feed-forward MLP</text>
    <text x="300" y="376" text-anchor="middle" font-size="11.5" fill="#5b6b85">Linear(d,4d) &#8594; GELU &#8594; Linear(4d,d)</text>
    <text x="300" y="388" text-anchor="middle" font-size="10.5" fill="#5b6b85">Part 1! &#8226; each token computes alone &#8226; &#167;5.4</text>
    <circle cx="300" cy="296" r="14" fill="#ffffff" stroke="#5b6b85" stroke-width="2"/>
    <text x="300" y="302" text-anchor="middle" font-size="15" fill="#1c2b4a">+</text>
  </g>
  <!-- residual skip for mlp -->
  <path d="M 300 470 L 490 470 L 490 296 L 316 296" fill="none" stroke="#d1495b" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="300" y1="464" x2="300" y2="444" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="404" x2="300" y2="396" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="338" x2="300" y2="312" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="300" cy="470" r="4" fill="#d1495b"/>
  <line x1="300" y1="282" x2="300" y2="252" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ top: head ============ -->
  <g font-size="13">
    <rect x="230" y="206" width="140" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
    <text x="300" y="225" text-anchor="middle" fill="#1c2b4a">final LayerNorm</text>
    <text x="300" y="240" text-anchor="middle" font-size="11" fill="#5b6b85">&#167;5.5</text>
    <rect x="200" y="130" width="200" height="48" rx="6" fill="#fbeaea" stroke="#d1495b" stroke-width="2.5"/>
    <text x="300" y="150" text-anchor="middle" fill="#1c2b4a">LM head: Linear(d, V)</text>
    <text x="300" y="166" text-anchor="middle" font-size="11" fill="#5b6b85">weights tied to E &#8226; &#167;5.5</text>
  </g>
  <line x1="300" y1="206" x2="300" y2="182" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="130" x2="300" y2="102" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="88" text-anchor="middle" font-size="13.5" fill="#1c2b4a">logits (T, V) &#8594; softmax &#8594; p(next token) at every position</text>

  <!-- side note -->
  <g font-size="12" fill="#5b6b85">
    <text x="640" y="850" text-anchor="middle">only 3 ingredients:</text>
    <text x="640" y="868" text-anchor="middle">matrix multiplies,</text>
    <text x="640" y="886" text-anchor="middle">nonlinearities,</text>
    <text x="640" y="904" text-anchor="middle">softmax &#8212; all of it</text>
    <text x="640" y="922" text-anchor="middle">trained by backprop</text>
    <text x="640" y="940" text-anchor="middle">on -log p(next token)</text>
  </g>
</svg>
