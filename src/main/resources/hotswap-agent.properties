# HotswapAgent configuration - only used when Tomcat runs on the DCEVM-style
# JetBrains Runtime image (docker/tomcat/Dockerfile.jbr-hotswap). Ignored
# (harmless) on the plain Temurin image.
#
# https://hotswapagent.org/

# Reload changed classes automatically as soon as the debugger pushes them.
autoHotswap=true

# Watch extra directories for changed .class files (paths are inside the
# container; WEB-INF/classes of the exploded deployment is watched by default).
# extraClasspath=

# Plugins are auto-detected (Hibernate, Weld, Mojarra/JSF are all supported).
# Disable one like this if it misbehaves:
# disabledPlugins=Hibernate
