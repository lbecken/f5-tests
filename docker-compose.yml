services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emr
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: emr
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr"]
      interval: 3s
      timeout: 3s
      retries: 10
    # Expose only if you want to inspect the data with psql from the host:
    ports:
      - "5434:5432"

  app:
    build: .
    ports:
      - "8084:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/emr
      DB_USER: emr
      DB_PASSWORD: emr
      # The dashboard reaches the EMR inside the same Tomcat:
      EMR_BASE_URL: http://localhost:8080/emr
      # --- step 3: the EMR enforces Keycloak-issued tokens ---
      # Set AUTH_ENABLED to "false" to run the API open again.
      AUTH_ENABLED: "true"
      # Tokens minted inside the compose network carry the first issuer;
      # tokens you fetch from the host (localhost:8085) carry the second.
      AUTH_ISSUER: http://keycloak:8080/realms/riverside,http://localhost:8085/realms/riverside
      AUTH_JWKS_URL: http://keycloak:8080/realms/riverside/protocol/openid-connect/certs
      # ... and the dashboard authenticates with client credentials:
      OAUTH_TOKEN_URL: http://keycloak:8080/realms/riverside/protocol/openid-connect/token
      OAUTH_CLIENT_ID: ward-dashboard
      OAUTH_CLIENT_SECRET: dashboard-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---- step 2: HL7 v2 -> FHIR via an interface engine ----

  mirth:
    image: nextgenhealthcare/connect:4.5.2
    ports:
      - "8444:8443" # Mirth Administrator / REST API (https, admin/admin)
      - "6661:6661" # MLLP listener of the HL7v2->FHIR channel
    volumes:
      - mirthdata:/opt/connect/appdata
    depends_on:
      - app

  # One-shot: imports + deploys the channel through Mirth's REST API.
  mirth-deploy:
    image: curlimages/curl:8.10.1
    volumes:
      - ./mirth:/mirth:ro
    entrypoint: ["/bin/sh", "/mirth/deploy.sh"]
    depends_on:
      - mirth

  # ---- step 2: identity provider (OAuth2 / SMART-on-FHIR direction) ----

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8085:8080" # admin console + riverside realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  dbdata:
  mirthdata:
