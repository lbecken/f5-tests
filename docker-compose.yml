services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emr
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: emr
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr"]
      interval: 3s
      timeout: 3s
      retries: 10
    # Expose only if you want to inspect the data with psql from the host:
    ports:
      - "5434:5432"

  app:
    build: .
    ports:
      - "8084:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/emr
      DB_USER: emr
      DB_PASSWORD: emr
      # The dashboard reaches the EMR inside the same Tomcat:
      EMR_BASE_URL: http://localhost:8080/emr
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
