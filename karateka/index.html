<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTRESS OF AKUMA — a Karateka-style browser game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <canvas id="screen" width="960" height="540"></canvas>
  <div id="help">
    ← → move &nbsp;·&nbsp; SPACE stance (run ⇄ fight) &nbsp;·&nbsp;
    U I O kick high/mid/low &nbsp;·&nbsp; J K L punch high/mid/low &nbsp;·&nbsp; ENTER start
  </div>
</div>
<!-- bump ?v= on every release so browsers never serve stale cached scripts -->
<script src="js/audio.js?v=3"></script>
<script src="js/input.js?v=3"></script>
<script src="js/rig.js?v=3"></script>
<script src="js/animations.js?v=3"></script>
<script src="js/fighter.js?v=3"></script>
<script src="js/ai.js?v=3"></script>
<script src="js/level.js?v=3"></script>
<script src="js/game.js?v=3"></script>
</body>
</html>
