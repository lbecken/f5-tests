# syndata configuration. Every value can be overridden on the command line;
# db.password can also come from the SYNDATA_DB_PASSWORD environment variable.

db.url=jdbc:postgresql://localhost:5432/mydb
db.user=myuser
db.password=secret

# Name of the Hibernate global id sequence used to mark PKs as sequence-backed.
sequence.global=hibernate_sequence

# Optional: enrich the scanned schema from compiled JPA entity classes.
# Adds what the database cannot express: Java enum values for @Enumerated
# columns without CHECK constraints, @Email hints, ...
entities.enabled=false
entities.path=/path/to/app/build/classes/java/main
entities.package=com.example.myapp

# Optional: use a local Ollama model to produce realistic values for free-text
# columns (one model call per column, results are pooled and sampled).
ai.enabled=false
ai.url=http://localhost:11434
ai.model=llama3.2
