<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEFENDER 3D — trench run prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛸</text></svg>">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #crt {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="312"></canvas></div>
<div id="crt"></div>
<!-- sprites + audio engine and sfx assets are shared with the 2D game;
     serve from the repo root: python3 -m http.server, open /defender3d/ -->
<script src="../defender/js/sprites.js"></script>
<script src="../defender/js/audio.js"></script>
<script src="js/game3d.js"></script>
</body>
</html>
